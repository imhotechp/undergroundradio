# Reverse proxy for undergroundradio.us — single domain, path-based routing:
#   /        -> Next.js frontend (localhost:3000)
#   /api/... -> Django backend (localhost:8000), with the /api prefix stripped
#               so Django's own URLs (e.g. /login/, /ground/) are unchanged.
#
# Install: copy to /etc/nginx/sites-available/undergroundradio.conf, then
#   sudo ln -s /etc/nginx/sites-available/undergroundradio.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then run: sudo certbot --nginx -d undergroundradio.us -d www.undergroundradio.us
# (certbot rewrites this file in place to add the HTTPS server block + redirect.)

server {
    listen 80;
    listen [::]:80;
    server_name undergroundradio.us www.undergroundradio.us;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
