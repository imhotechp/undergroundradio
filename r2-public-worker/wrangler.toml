# Deploy: from this directory, `npx wrangler deploy`
# Or via the Cloudflare dashboard's Git integration, with this directory set
# as the project's Root directory.
#
# `name` below must match the Worker's actual name on your Cloudflare
# account (Workers & Pages > your worker > Settings), not just whatever was
# written here — `wrangler deploy` creates a brand-new Worker under
# whatever `name` says instead of updating the real one if they don't match.
# Currently deployed at undergroundradio-coverart-deploy.jolly-term-62bf.workers.dev.

name = "undergroundradio-coverart-deploy"
main = "src/worker.js"
compatibility_date = "2026-01-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "emerald"
